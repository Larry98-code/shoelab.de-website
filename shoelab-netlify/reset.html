<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Reset Password — ShoeLab.de</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
    background:radial-gradient(1200px 600px at 50% -10%, #1a0606 0%, #080808 55%);
    color:#fff;font-family:'Inter',sans-serif;font-weight:300;}
  .card{width:100%;max-width:400px;background:rgba(20,20,20,0.7);border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;padding:2.4rem 2rem;backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,0.6);}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:0.1em;text-align:center;margin-bottom:0.3rem;}
  .brand span{color:#CC1111;}
  h1{font-size:1.05rem;font-weight:600;text-align:center;margin-bottom:0.4rem;}
  .sub{color:#888;font-size:0.82rem;text-align:center;margin-bottom:1.8rem;}
  label{display:block;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:#888;margin-bottom:0.4rem;}
  input{width:100%;background:#0d0d0d;border:1px solid rgba(255,255,255,0.12);border-radius:10px;
    padding:0.8rem 0.95rem;color:#fff;font-family:inherit;font-size:0.92rem;margin-bottom:1rem;}
  input:focus{outline:none;border-color:#CC1111;}
  button{width:100%;background:#CC1111;color:#fff;border:none;border-radius:10px;padding:0.85rem;
    font-family:inherit;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;font-size:0.82rem;cursor:pointer;}
  button:hover{background:#FF2020;}
  button:disabled{opacity:0.5;cursor:default;}
  .msg{font-size:0.82rem;text-align:center;margin-top:1rem;min-height:1.1rem;}
  .ok{color:#46d369;}.err{color:#ff6b6b;}
  a{color:#CC1111;text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">SHOE<span>LAB</span></div>
    <h1>Choose a new password</h1>
    <p class="sub">Enter a new password for your account.</p>
    <form id="form">
      <label>New password</label>
      <input type="password" id="pw" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"/>
      <label>Confirm password</label>
      <input type="password" id="pw2" autocomplete="new-password" required placeholder="Repeat password"/>
      <button type="submit" id="btn">Reset password</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="sub" style="margin:1.2rem 0 0;"><a href="/">← Back to ShoeLab</a></p>
  </div>
<script>
(function(){
  var token=new URLSearchParams(location.search).get('token');
  var msg=document.getElementById('msg'), btn=document.getElementById('btn');
  function set(t,ok){ msg.textContent=t||''; msg.className='msg '+(ok?'ok':'err'); }
  if(!token){ set('Invalid reset link. Please request a new one from the login screen.',false); btn.disabled=true; }
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
    if(pw!==pw2){ set('Passwords do not match.',false); return; }
    if(pw.length<8){ set('Password must be at least 8 characters.',false); return; }
    btn.disabled=true; set('…',true);
    fetch('/api/account/reset',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token,password:pw})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
      .then(function(res){
        if(res.ok){ set('✓ Password updated! Redirecting to sign in…',true);
          setTimeout(function(){ location.href='/account.html'; },1500); }
        else { btn.disabled=false; set((res.d&&res.d.error)||'Could not reset password.',false); }
      }).catch(function(){ btn.disabled=false; set('Network error. Try again.',false); });
  });
})();
</script>
</body>
</html>
