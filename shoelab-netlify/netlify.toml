[build]
  base      = "shoelab-netlify"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Keep the platform-neutral /api/* paths working on Netlify too
# (Cloudflare Pages serves them natively via functions/api/*.js)
[[redirects]]
  from   = "/api/wesley"
  to     = "/.netlify/functions/wesley"
  status = 200

[[redirects]]
  from   = "/api/geo"
  to     = "/.netlify/functions/geo"
  status = 200

# Clean URLs for the booking flow, so /book and /checkout work as links.
[[redirects]]
  from   = "/book"
  to     = "/booking.html"
  status = 301

[[redirects]]
  from   = "/checkout"
  to     = "/checkout.html"
  status = 301

[[redirects]]
  from   = "/brushes"
  to     = "/brushes.html"
  status = 301
