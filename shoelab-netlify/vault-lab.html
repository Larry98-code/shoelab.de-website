<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080808"/>
<title>Lab Console — ShoeLab Vault</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="stylesheet" href="/css/vault.css?v=3"/>
<script>document.documentElement.classList.add('v-wait');setTimeout(function(){document.documentElement.classList.remove('v-wait');},2500);</script>
</head>
<body>

<header class="v-nav" id="vNav"></header>

<main class="v-main">
  <div class="v-me-head">
    <div>
      <p class="v-eyebrow" data-t="labEyebrow">Specialists only</p>
      <h1 class="v-h1" data-t="labTitle">Lab console</h1>
    </div>
    <div class="v-btn-row">
      <button type="button" class="v-btn ghost sm" id="labRefresh" data-t="refresh">Refresh</button>
    </div>
  </div>
  <div id="labBody">
    <div class="v-stats"><div class="v-skel" style="height:84px;border-radius:16px;"></div><div class="v-skel" style="height:84px;border-radius:16px;"></div><div class="v-skel" style="height:84px;border-radius:16px;"></div><div class="v-skel" style="height:84px;border-radius:16px;"></div></div>
    <div class="v-skel" style="height:260px;border-radius:20px;"></div>
  </div>
</main>

<footer class="v-foot" id="vFoot"></footer>
<nav class="v-tabbar" id="vTabbar"></nav>

<script src="/js/sl-geo.js?v=2" defer></script>
<script src="/js/vault-i18n/en.js?v=2" defer></script>
<script src="/js/vault-core.js?v=4" defer></script>
<script src="/js/vault-lab.js?v=3" defer></script>
<script src="/js/vault-help.js?v=2" defer></script>
</body>
</html>
