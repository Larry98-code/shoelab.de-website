<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script src="/js/consent.js?v=1" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080808"/>
<title>Verify a Certificate — ShoeLab Legit Check</title>
<meta name="description" content="Check a ShoeLab certificate: type its number (SL-XXXX-XXXX) to see the sneakers the ShoeLab lab in Bremen verified as authentic."/>
<link rel="canonical" href="https://shoelabonline.de/verified.html"/>
<meta name="robots" content="index, follow"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="ShoeLab.de"/>
<meta property="og:title" content="ShoeLab certificate — verified authentic"/>
<meta property="og:description" content="These sneakers were checked by the ShoeLab lab in Bremen. See the photos and the certificate."/>
<meta property="og:url" content="https://shoelabonline.de/verified.html"/>
<meta property="og:image" content="https://shoelabonline.de/img/og-vault.jpg"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://shoelabonline.de/img/og-vault.jpg"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="stylesheet" href="/css/vault.css?v=12"/>
<script>document.documentElement.classList.add('v-wait');setTimeout(function(){document.documentElement.classList.remove('v-wait');},2500);</script>
<link rel="stylesheet" href="/css/sl-polish.css?v=2"/>
</head>
<body>

<div class="v-site" id="vSite"></div>
<header class="v-nav" id="vNav"></header>

<main class="v-main v-cert-main">
  <section class="v-cert-look">
    <p class="v-eyebrow" data-t="lgEyebrow">ShoeLab Legit Check</p>
    <h1 class="v-h1" data-t="certPageT">Check a certificate</h1>
    <form class="v-lg-verform" id="cfForm">
      <input class="v-input" name="c" id="cfCode" placeholder="SL-7K2Q-9XF4" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" aria-label="Certificate number"/>
      <button type="submit" class="v-btn" data-t="lgVerGo">Check</button>
    </form>
  </section>
  <div id="cfBody" aria-live="polite"></div>
  <section class="v-section v-cert-cta">
    <div>
      <h2 class="v-h2" data-t="certCtaT">Buying or selling sneakers on another app?</h2>
      <p class="v-lead" data-t="certCtaP">Have any pair checked by the ShoeLab lab — or buy in the ShoeLab Vault, where every pair is checked before you pay.</p>
    </div>
    <div class="v-btn-row">
      <a class="v-btn" href="/legit.html" data-t="certCtaCheck">Start a Legit Check</a>
      <a class="v-btn ghost" href="/vault.html" data-t="certCtaVault">Browse the Vault</a>
    </div>
  </section>
</main>

<footer class="v-foot" id="vFoot"></footer>
<nav class="v-tabbar" id="vTabbar"></nav>

<script src="/js/sl-geo.js?v=2" defer></script>
<script src="/js/vault-i18n/en.js?v=10" defer></script>
<script src="/js/vault-core.js?v=15" defer></script>
<script src="/js/vault-viewer.js?v=3" defer></script>
<script src="/js/vault-cert.js?v=1" defer></script>
<script src="/js/vault-verified.js?v=2" defer></script>
<script src="/js/vault-help.js?v=2" defer></script>
</body>
</html>
